name: istqb-academy

# Arranque:  cp .env.example .env  (edita los valores)  &&  docker compose up -d --build
# Compose lee automáticamente deploy/.env, que es el único archivo con secretos.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo se ejecuta la primera vez, cuando el volumen de datos está vacío.
      - ../db/supabase/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # Sin `ports`: la base solo es alcanzable desde la red interna de Compose.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET}
      # sslmode=disable es seguro aquí: el tráfico no abandona la red de Compose.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      LOG_DIR: /app/logs
    volumes:
      - applogs:/app/logs
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # --- Acceso sin IP pública ni dominio -------------------------------------
  # Perfil "quick": túnel efímero de Cloudflare. Publica el portal en una URL
  # https://<aleatorio>.trycloudflare.com sin cuenta ni DNS. La URL cambia cada
  # vez que se reinicia el contenedor.
  #   docker compose --profile quick up -d
  quicktunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quick"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://app:3000
    networks: [internal]

  # Perfil "tunnel": túnel con nombre propio (URL fija) usando una cuenta
  # gratuita de Cloudflare y un dominio alojado en su DNS.
  #   CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [internal]

volumes:
  pgdata:
  applogs:
  caddy_data:
  caddy_config:

networks:
  internal:
