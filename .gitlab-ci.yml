# Despliegue a Vercel desde GitLab autoalojado.
#
# Vercel no tiene integración nativa con GitLab Self-Managed: el despliegue lo
# ejecuta este pipeline con la CLI y un token. Requiere tres variables CI/CD en
# GitLab (Settings > CI/CD > Variables):
#   VERCEL_TOKEN       token de acceso de Vercel (marcar Masked y Protected)
#   VERCEL_ORG_ID      Team ID (o User ID si el proyecto es personal)
#   VERCEL_PROJECT_ID  Project ID del proyecto en Vercel
#
# Guía: https://vercel.com/kb/guide/how-can-i-use-gitlab-pipelines-with-vercel

default:
  image: node:22

stages:
  - deploy

deploy_production:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm install --global vercel@latest
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    # Sin --prebuilt a propósito: Vercel construye en su infraestructura igual
    # que hasta ahora, así que sigue aplicando el bloque `builds` de vercel.json.
    # Con --prebuilt el build corre en el runner y ese formato legacy no aplica.
    # --logs imprime los errores de compilación en el log del job: sin el flag,
    # un fallo de build solo devuelve un código de salida y la URL del inspector.
    - vercel deploy --prod --yes --logs --token=$VERCEL_TOKEN --meta gitlabDeployment=1 --meta gitlabCommitRef=$CI_COMMIT_BRANCH

